<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
<style>text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }</style>
<rect width="800" height="400" fill="#fafafa" rx="12"/>
<text x="400" y="30" fill="#1a1a1a" font-size="20" font-weight="700" text-anchor="middle">Loop Prevention via senderId</text>

<!-- Tab A -->
<rect x="40" y="60" width="180" height="90" fill="#e8f4fd" stroke="#2196F3" stroke-width="2" rx="6"/>
<text x="130" y="85" fill="#2196F3" font-size="16" font-weight="700" text-anchor="middle">Tab A</text>
<text x="130" y="108" fill="#333" font-size="11" text-anchor="middle">tabId: uuid-aaa</text>
<text x="130" y="128" fill="#888" font-size="10" text-anchor="middle">senderId = uuid-aaa</text>

<!-- BroadcastChannel -->
<rect x="310" y="175" width="180" height="70" fill="#fff3e0" stroke="#FF9800" stroke-width="2" rx="6"/>
<text x="400" y="200" fill="#E65100" font-size="14" font-weight="700" text-anchor="middle">BroadcastChannel</text>
<text x="400" y="222" fill="#333" font-size="11" text-anchor="middle">All messages pass through</text>

<!-- Tab B -->
<rect x="580" y="60" width="180" height="90" fill="#e8f4fd" stroke="#2196F3" stroke-width="2" rx="6"/>
<text x="670" y="85" fill="#2196F3" font-size="16" font-weight="700" text-anchor="middle">Tab B</text>
<text x="670" y="108" fill="#333" font-size="11" text-anchor="middle">tabId: uuid-bbb</text>
<text x="670" y="128" fill="#888" font-size="10" text-anchor="middle">senderId = uuid-bbb</text>

<!-- Tab A → Channel -->
<line x1="130" y1="150" x2="130" y2="165" stroke="#2196F3" stroke-width="2"/>
<line x1="130" y1="165" x2="350" y2="165" stroke="#2196F3" stroke-width="2"/>
<line x1="350" y1="165" x2="350" y2="175" stroke="#2196F3" stroke-width="2"/>
<polygon points="346,171 354,175 346,179" fill="#2196F3"/>
<text x="220" y="158" fill="#2196F3" font-size="10" text-anchor="middle">postMessage</text>

<!-- Channel → Tab B (accepted) -->
<line x1="450" y1="175" x2="450" y2="165" stroke="#2E7D32" stroke-width="2"/>
<line x1="450" y1="165" x2="670" y2="165" stroke="#2E7D32" stroke-width="2"/>
<line x1="670" y1="165" x2="670" y2="150" stroke="#2E7D32" stroke-width="2"/>
<polygon points="666,154 674,150 666,146" fill="#2E7D32"/>
<text x="560" y="158" fill="#2E7D32" font-size="10" text-anchor="middle">accepted</text>

<!-- Channel → Tab A echo (ignored) -->
<line x1="370" y1="245" x2="370" y2="260" stroke="#D32F2F" stroke-width="2"/>
<line x1="370" y1="260" x2="130" y2="260" stroke="#D32F2F" stroke-width="2"/>
<line x1="130" y1="260" x2="130" y2="150" stroke="#D32F2F" stroke-width="2" stroke-dasharray="6,4"/>
<polygon points="126,156 134,150 126,144" fill="#D32F2F"/>
<text x="230" y="275" fill="#D32F2F" font-size="11" text-anchor="middle">echo back to Tab A → IGNORED</text>

<rect x="40" y="310" width="720" height="70" fill="#e8f5e9" stroke="#4CAF50" stroke-width="2" rx="6"/>
<text x="400" y="335" fill="#2E7D32" font-size="14" font-weight="700" text-anchor="middle">How senderId prevents echo loops</text>
<text x="400" y="358" fill="#333" font-size="12" text-anchor="middle">Each tab tags messages with its own UUID. Receivers ignore any message where senderId matches their own ID.</text>
</svg>
