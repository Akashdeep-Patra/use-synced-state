<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420">

<style>text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }</style>
<rect width="800" height="420" fill="#fafafa" rx="12"/>
<text x="400" y="30" fill="#1a1a1a" font-size="20" font-weight="700" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">Architecture Overview</text>

<!-- Three Tabs -->
<rect x="50" y="60" width="180" height="100" fill="#e8f4fd" stroke="#2196F3" stroke-width="2" rx="6"/>
<text x="140" y="85" fill="#2196F3" font-size="16" font-weight="700" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">Tab A</text>
<text x="140" y="110" fill="#333" font-size="12" font-weight="400" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">useSyncedState</text>
<text x="140" y="130" fill="#888" font-size="10" font-weight="400" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">stateRef + listener</text>

<rect x="310" y="60" width="180" height="100" fill="#e8f4fd" stroke="#2196F3" stroke-width="2" rx="6"/>
<text x="400" y="85" fill="#2196F3" font-size="16" font-weight="700" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">Tab B</text>
<text x="400" y="110" fill="#333" font-size="12" font-weight="400" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">useSyncedState</text>
<text x="400" y="130" fill="#888" font-size="10" font-weight="400" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">stateRef + listener</text>

<rect x="570" y="60" width="180" height="100" fill="#e8f4fd" stroke="#2196F3" stroke-width="2" rx="6"/>
<text x="660" y="85" fill="#2196F3" font-size="16" font-weight="700" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">Tab C</text>
<text x="660" y="110" fill="#333" font-size="12" font-weight="400" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">useSyncedState</text>
<text x="660" y="130" fill="#888" font-size="10" font-weight="400" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">stateRef + listener</text>

<!-- BroadcastChannel -->
<rect x="310" y="190" width="180" height="80" fill="#fff3e0" stroke="#FF9800" stroke-width="2" rx="6"/>
<text x="400" y="215" fill="#E65100" font-size="14" font-weight="700" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">BroadcastChannel</text>
<text x="400" y="238" fill="#333" font-size="11" font-weight="400" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">Zero-latency fan-out</text>

<!-- navigator.locks -->
<rect x="310" y="310" width="180" height="70" fill="#e8f5e9" stroke="#4CAF50" stroke-width="2" rx="6"/>
<text x="400" y="332" fill="#2E7D32" font-size="14" font-weight="700" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">navigator.locks</text>
<text x="400" y="355" fill="#333" font-size="11" font-weight="400" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">Exclusive write mutex</text>

<!-- Arrows from tabs to BroadcastChannel -->
<line x1="140" y1="160" x2="200" y2="190" stroke="#2196F3" stroke-width="2"/>
<line x1="400" y1="160" x2="400" y2="190" stroke="#2196F3" stroke-width="2"/>
<line x1="660" y1="160" x2="600" y2="190" stroke="#2196F3" stroke-width="2"/>
<line x1="400" y1="270" x2="400" y2="310" stroke="#FF9800" stroke-width="2"/>
<line x1="310" y1="345" x2="250" y2="380" stroke="#4CAF50" stroke-width="2"/>
<line x1="400" y1="345" x2="400" y2="380" stroke="#4CAF50" stroke-width="2"/>
<line x1="490" y1="345" x2="550" y2="380" stroke="#4CAF50" stroke-width="2"/>
<text x="400" y="395" fill="#666" font-size="12" font-weight="500" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">State syncs to all tabs instantly</text>

</svg>