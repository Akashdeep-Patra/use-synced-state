<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420">

<style>text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }</style>
<rect width="800" height="420" fill="#fafafa" rx="12"/>
<text x="400" y="30" fill="#1a1a1a" font-size="20" font-weight="700" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">How State Syncs Across Tabs</text>

<!-- Tab A (source) -->
<rect x="50" y="70" width="160" height="100" fill="#e3f2fd" stroke="#1976D2" stroke-width="2" rx="6"/>
<text x="130" y="95" fill="#1976D2" font-size="16" font-weight="700" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">Tab A</text>
<text x="130" y="120" fill="#333" font-size="12" font-weight="400" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">setSyncedState(5)</text>
<text x="130" y="142" fill="#888" font-size="10" font-weight="400" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">User clicks update</text>

<!-- Arrow from Tab A to Channel -->
<line x1="210" y1="120" x2="280" y2="120" stroke="#1976D2" stroke-width="2"/>
<line x1="280" y1="120" x2="290" y2="120" stroke="#1976D2" stroke-width="2"/>
<polygon points="296,116 288,120 296,124" fill="#1976D2"/>

<!-- BroadcastChannel -->
<rect x="310" y="70" width="180" height="100" fill="#fff3e0" stroke="#F57C00" stroke-width="2" rx="6"/>
<text x="400" y="95" fill="#F57C00" font-size="13" font-weight="700" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">BroadcastChannel</text>
<text x="400" y="120" fill="#333" font-size="12" font-weight="400" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">postMessage()</text>
<text x="400" y="142" fill="#888" font-size="10" font-weight="400" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">(fan-out to all)</text>

<!-- Arrow from Channel to Tab B -->
<line x1="490" y1="120" x2="560" y2="120" stroke="#388E3C" stroke-width="2"/>
<polygon points="566,116 558,120 566,124" fill="#388E3C"/>

<!-- Tab B -->
<rect x="580" y="70" width="160" height="100" fill="#e8f5e9" stroke="#388E3C" stroke-width="2" rx="6"/>
<text x="660" y="95" fill="#388E3C" font-size="16" font-weight="700" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">Tab B</text>
<text x="660" y="120" fill="#333" font-size="12" font-weight="400" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">state → 5</text>
<text x="660" y="142" fill="#888" font-size="10" font-weight="400" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">Auto-updated!</text>

<!-- Steps -->
<text x="400" y="210" fill="#666" font-size="14" font-weight="600" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">Step-by-step data flow</text>
<rect x="50" y="230" width="700" height="35" fill="#f5f5f5" stroke="#ddd" stroke-width="2" rx="6"/>
<text x="400" y="250" fill="#333" font-size="12" font-weight="500" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">① Tab A calls setSyncedState(value) → acquires exclusive lock</text>
<rect x="50" y="275" width="700" height="35" fill="#f5f5f5" stroke="#ddd" stroke-width="2" rx="6"/>
<text x="400" y="295" fill="#333" font-size="12" font-weight="500" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">② Optimistic update: Tab A UI updates immediately</text>
<rect x="50" y="320" width="700" height="35" fill="#f5f5f5" stroke="#ddd" stroke-width="2" rx="6"/>
<text x="400" y="340" fill="#333" font-size="12" font-weight="500" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">③ BroadcastChannel sends message to ALL sibling tabs</text>
<rect x="50" y="365" width="700" height="35" fill="#f5f5f5" stroke="#ddd" stroke-width="2" rx="6"/>
<text x="400" y="385" fill="#333" font-size="12" font-weight="500" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">④ Each tab receives → updates local state → re-renders</text>

</svg>